name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # unit tests (mvn test) + Testcontainers integration tests (*IT, need Docker, available on ubuntu runners)
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports
            target/failsafe-reports

  compose-smoke-test:
    name: Docker Compose stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start MySQL + Redis + app
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          curl -fsS http://localhost:48080/actuator/health
          echo
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"123456"}' http://localhost:48080/employee/login | grep -q '"code":1'
          curl -fsS -b cookies.txt 'http://localhost:48080/dish/page?page=1&pageSize=5' | grep -q 'Kung Pao Chicken\|Mapo Tofu'
          curl -fsS -o /dev/null http://localhost:48080/front/page/login.html
          curl -fsS -o /dev/null http://localhost:48080/doc.html
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
